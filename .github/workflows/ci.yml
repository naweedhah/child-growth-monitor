name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      # Generated Drift code is committed; fail if it is stale.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: git diff --exit-code -- lib/
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      # Talks to the Firebase emulator on the host (10.0.2.2) by default; see README.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: child-growth-monitor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
